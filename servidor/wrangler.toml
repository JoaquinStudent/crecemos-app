# Configuración del servidor intermedio del chat "Preguntarle a mis datos" (Cloudflare Worker).
# Aquí NO va ninguna clave: OPENROUTER_API_KEY se guarda con `npx wrangler secret put` (ver README.md).
name = "crecemos-asistente"
main = "worker.js"
compatibility_date = "2026-10-08"
workers_dev = true

# Variables públicas (no son secretos): se cambian aquí y se publican otra vez con `npx wrangler deploy`.
[vars]
# Jev, por la API tipada de OpenRouter (/api/v1/systemone). `jev-latest` es el alias del Jev más nuevo;
# `jev-1.13` fija una versión. Si Jev falla o responde algo inválido, clasifica DeepSeek.
JEV_MODELO = "jev-latest"
# Respaldo y segundo intento al clasificar (chat de OpenRouter), y el que redacta las respuestas
# (`redactar`) y conversa (`conversar`).
DEEPSEEK_MODELO = "deepseek/deepseek-v4-flash"
# Proveedores de EE. UU. permitidos para DeepSeek (nombres de OpenRouter, separados por comas).
DEEPSEEK_PROVEEDORES = "deepinfra,parasail,cloudflare,digitalocean"

# Límite por IP: 40 peticiones por minuto en cada ubicación de Cloudflare (period solo admite 10 o 60).
# Una pregunta del chat gasta hasta 3 peticiones (interpretar, y a la vez redactar y juzgar): unas 13
# preguntas por minuto por IP. Antes eran 20 por minuto, cuando una pregunta gastaba 1 o 2.
# Requiere Wrangler 4.36.0 o más nuevo. `namespace_id` es un número que elegimos y debe ser único en la cuenta.
[[ratelimits]]
name = "LIMITE"
namespace_id = "48210"

  [ratelimits.simple]
  limit = 40
  period = 60

# Límite por IP, MÁS ESTRICTO, solo para reservar, subir y borrar un reporte: 5 por minuto por IP en
# cada ubicación. Es un binding aparte del de arriba para que las subidas (que cuestan almacenamiento) no
# gasten las preguntas del chat ni al revés. `namespace_id` debe ser único en la cuenta.
[[ratelimits]]
name = "LIMITE_SUBIDA"
namespace_id = "48211"

  [ratelimits.simple]
  limit = 5
  period = 60

# Límite GLOBAL (no por IP) para reservar, subir y borrar un reporte: 10 por minuto en total, con una clave
# fija ('global'). Acota una ráfaga repartida entre muchas IP; el tope diario de reservas, que no es atómico,
# solo es aproximado. `namespace_id` debe ser único en la cuenta. Sin este binding no hay límite global.
[[ratelimits]]
name = "LIMITE_GLOBAL_SUBIDA"
namespace_id = "48212"

  [ratelimits.simple]
  limit = 10
  period = 60

# Reportes en PDF que la persona decide subir para compartir un enlace que caduca (30 días). El bucket se
# crea una sola vez con `npx wrangler r2 bucket create crecemos-reportes` (ver README.md). Sin este
# binding, `subirReporte` responde NO_CONFIGURADO y el resto del Worker sigue igual.
[[r2_buckets]]
binding = "REPORTES"
bucket_name = "crecemos-reportes"
